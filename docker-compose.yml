name: distributed-tic-tac-toe

services:

  # Single-node Kafka in KRaft mode - broker and controller in one process, no ZooKeeper.
  # Two listeners on purpose: INTERNAL for container-to-container traffic and PLAINTEXT advertised
  # as localhost so tools on the host machine can also reach the broker.
  kafka:
    image: apache/kafka:3.9.0
    container_name: tictactoe-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  game-engine-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: game-engine-service
    container_name: tictactoe-engine
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  game-session-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: game-session-service
    container_name: tictactoe-session
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GAME_ENGINE_URL: http://game-engine-service:8081
      # Pacing for the viewer: without a pause between moves the whole game is over before the
      # browser has painted anything.
      MOVE_DELAY: 600ms
      MOVE_STRATEGY: random
    depends_on:
      kafka:
        condition: service_healthy
      game-engine-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  game-ui-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: game-ui-service
    container_name: tictactoe-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GAME_SESSION_URL: http://game-session-service:8082
    depends_on:
      kafka:
        condition: service_healthy
      game-session-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
