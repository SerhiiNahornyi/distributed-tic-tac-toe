server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: game-engine-service

  # In-memory H2 as allowed by the assignment. DB_CLOSE_DELAY keeps the schema alive for the
  # lifetime of the JVM rather than the lifetime of the first connection.
  datasource:
    url: jdbc:h2:mem:gameengine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # The event type travels in the JSON body via @JsonTypeInfo, so consumers do not need to
        # know producer class names. Type headers would couple them to this service's packages.
        spring.json.add.type.headers: false
        # send() is only asynchronous once the producer has topic metadata; without a bound it
        # blocks the calling thread for 60 seconds when the broker is unreachable. Publishing is
        # fire-and-forget, so failing fast and logging beats stalling a move that already committed.
        max.block.ms: 2000
    admin:
      # A missing broker must not stop the engine from serving REST traffic.
      fail-fast: false
      # Bounds both topic creation at startup and the cluster-id lookup that observed sends make.
      # Left at their 30-60s defaults, an absent broker turns a two-second boot into a
      # forty-second one and stalls the publisher thread on every event.
      operation-timeout: 3s
      close-timeout: 3s
      properties:
        request.timeout.ms: 3000
        default.api.timeout.ms: 5000
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  level:
    dev.nahornyi.tictactoe: INFO
